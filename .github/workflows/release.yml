# Builds Cleanup Assist and publishes a GitHub release whenever a version tag
# is pushed. Releasing v0.2.0 is just:
#
#   git tag v0.2.0
#   git push --tags
#
# The release appears with the NSIS installer, the MSI, and the portable exe
# attached. Remember to bump `version` in src-tauri/tauri.conf.json,
# src-tauri/Cargo.toml, and package.json first so the artifacts are named
# consistently.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      # Builds the app (runs the frontend build via beforeBuildCommand),
      # creates the release for this tag, and uploads the NSIS + MSI bundles.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cleanup Assist ${{ github.ref_name }}"
          releaseBody: "See the assets below. The `-setup.exe` is the recommended download; `cleanup-assist.exe` is portable."
          releaseDraft: false
          prerelease: false

      # tauri-action uploads the installers; add the portable exe alongside.
      - name: Attach portable exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} "target/release/cleanup-assist.exe" --clobber

      # The builds are unsigned, so publish checksums people can verify against.
      - name: Publish checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            Get-ChildItem "target/release/bundle/nsis/*-setup.exe"
            Get-ChildItem "target/release/bundle/msi/*.msi"
            Get-ChildItem "target/release/cleanup-assist.exe"
          )
          $lines = $files | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt
          gh release upload $tag SHA256SUMS.txt --clobber

          # Build the notes in a file: multi-line args to native exes are fragile.
          # Single quotes keep the backticks literal rather than escaping.
          $fence = '```'
          $notes = @(
            "Download the setup.exe (recommended), the .msi for scripted installs,"
            "or cleanup-assist.exe to run it portable."
            ""
            "Windows will warn that the publisher is unknown - these builds are"
            "unsigned. Click **More info -> Run anyway**, or verify the download"
            "against the checksums below."
            ""
            "### SHA-256"
            ""
            $fence
            $lines
            $fence
          )
          $notes | Out-File -Encoding utf8 release-notes.md
          gh release edit $tag --notes-file release-notes.md

      # Point the website at this release. Committing the manifest to main is
      # what makes Vercel rebuild, and its build step then downloads these
      # installers into site/assets so the download URLs serve the new version.
      # The binaries themselves are never committed.
      - name: Update site download manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''

          # Ask GitHub for the stored asset names: it rewrites spaces as dots,
          # so these differ from the filenames the build produced.
          $names = gh release view $tag --json assets --jq '.assets[].name'
          $setupName    = $names | Where-Object { $_ -like '*-setup.exe' }   | Select-Object -First 1
          $msiName      = $names | Where-Object { $_ -like '*.msi' }         | Select-Object -First 1
          $portableName = $names | Where-Object { $_ -eq 'cleanup-assist.exe' } | Select-Object -First 1
          if (-not ($setupName -and $msiName -and $portableName)) {
            throw "could not resolve all three asset names from release $tag"
          }

          function Get-Sha($path) { (Get-FileHash $path -Algorithm SHA256).Hash.ToLower() }
          $setupSha    = Get-Sha (Get-ChildItem "target/release/bundle/nsis/*-setup.exe").FullName
          $msiSha      = Get-Sha (Get-ChildItem "target/release/bundle/msi/*.msi").FullName
          $portableSha = Get-Sha "target/release/cleanup-assist.exe"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          $manifest = [ordered]@{
            _comment = "Names the release whose installers the site serves. Updated automatically by .github/workflows/release.yml; the resulting push triggers a Vercel rebuild, which downloads these assets into site/assets."
            version  = $version
            tag      = $tag
            released = (Get-Date -Format 'yyyy-MM-dd')
            _names   = "GitHub replaces spaces with dots when it stores release assets, so these differ from the built filenames."
            assets   = [ordered]@{ setup = $setupName; msi = $msiName; portable = $portableName }
            sha256   = [ordered]@{ setup = $setupSha;  msi = $msiSha;  portable = $portableSha }
          }
          New-Item -ItemType Directory -Force site/assets | Out-Null
          $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 site/assets/manifest.json

          git add site/assets/manifest.json
          if (git status --porcelain site/assets/manifest.json) {
            git commit -m "Point site downloads at $tag"
            git push origin main
            Write-Host "manifest updated to $tag"
          } else {
            Write-Host "manifest already current"
          }
