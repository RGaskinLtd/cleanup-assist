[package]
name = "cleanup-assist"
version = "0.2.0"
description = "Find what's eating your disk — and whether it's safe to reclaim"
authors = ["Richard Gaskin"]
edition = "2021"

[lib]
name = "cleanup_assist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scanner-core = { path = "../crates/scanner-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
